<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page introuvable · Noméo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFC61A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--y:#FFC61A;--ink:#16181B;--paper:#FFC61A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:400 17px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:32px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:760px;text-align:center}
img{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 10px rgba(20,20,20,.18))}
h1{font-size:clamp(1.9rem,1.2rem + 3vw,3rem);line-height:1.05;letter-spacing:-.03em;margin:32px 0 10px;text-wrap:balance}
p{margin:0 auto 26px;max-width:42ch;color:#2B2B2B}
a{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:999px;background:#fff;color:var(--ink);font-weight:750;text-decoration:none;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/img/scene-perdus.webp" alt="Flocon et Zeste sont perdus, Dodo dort entre eux" width="924" height="464">
  <h1>Oups, cette page n’existe pas</h1>
  <p>Flocon et Zeste la cherchent encore. Dodo, lui, s’est rendormi. Revenez à l’accueil pour trouver votre objet.</p>
  <a href="/">Retour à l’accueil</a>
</main>
</body>
</html>
